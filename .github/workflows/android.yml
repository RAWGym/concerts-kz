name: Android-сканер

# Собирает APK «Concerts Сканер». В pull request — только проверка сборки.
# В main — подписанный APK и выпуск в Releases: приложения на телефонах
# находят его при запуске (version.json) и обновляются.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

env:
  # Отпечаток ключа подписи. Если APK подписан другим ключом, выпуск не публикуется:
  # иначе обновление не встанет на телефоны тикеторов.
  CERT_SHA256: b754f4ad6aebe4a4581368e852f6bbd828f0c3e54414ee16c313613d2dee7935

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Ключ подписи
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          if [ -z "$ANDROID_SIGNING_PASSWORD" ]; then
            echo "::error::Нет секрета ANDROID_SIGNING_PASSWORD (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in android/release.keystore.enc -out "$RUNNER_TEMP/release.keystore" \
            -pass env:ANDROID_SIGNING_PASSWORD
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Сборка APK
        working-directory: android
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}

      - name: Проверка подписи
        if: env.ANDROID_KEYSTORE_FILE != ''
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs "$APK" | tee certs.txt
          grep -qi "SHA-256 digest: $CERT_SHA256" certs.txt || { echo "::error::APK подписан не тем ключом"; exit 1; }
          cp "$APK" concerts-scanner.apk
          printf '{"versionCode": %s, "versionName": "1.0.%s"}\n' "${{ github.run_number }}" "${{ github.run_number }}" > version.json

      - name: Выпуск
        if: env.ANDROID_KEYSTORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "scanner-1.0.${{ github.run_number }}" concerts-scanner.apk version.json \
            --title "Concerts Сканер 1.0.${{ github.run_number }}" \
            --notes "Приложение для тикеторов. Установка: скачайте concerts-scanner.apk на Android и откройте. Уже установленные приложения обновятся сами при запуске." \
            --latest

      - name: APK для проверки
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: concerts-scanner-unsigned
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
